<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="Accounts" />
    <meta name="description" content="Accounts" />
    <title>CFAC Portal | {% block title %}TODO{% endblock title %}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap_helpers.css') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons-1.13.1/bootstrap-icons.min.css') }}" />

    <script charset="utf8" src="{{ url_for('static', filename='Sortable.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='bulma/css/bulma.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='DataTables/datatables.min.css') }}" />

</head>

<body>
    <header>

        <nav class="navbar is-info has-shadow" aria-label="main navigation">
            <div class="navbar-brand">
                <div class="navbar-start">
                    <a class="navbar-item" href="{{ url_for('main.index') }}">Home</a>
                    <a class="navbar-item" href="{{ url_for('todo.board') }}">Task board</a>
                </div>
            </div>
            {% include "partials/navbar_user_details.html" %}
        </nav>
    </header>

    <div class="container is-fluid">

        {% if current_user.is_authenticated %}
        {% block content %}{% endblock content %}
        {% endif %}
    </div>
    <script charset="utf8" src="{{ url_for('static', filename='DataTables/datatables.min.js') }}"></script>

    {% block scripts %}

    {% endblock scripts %}

</body>

</html>
